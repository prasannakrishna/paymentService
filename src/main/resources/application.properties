spring.application.name=paymentService

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/payment
spring.datasource.username=${DB_USER:pocuser}
spring.datasource.password=${DB_PASSWORD:Admin@1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# PostgreSQL: disable open-in-view to avoid lazy-loading surprises
spring.jpa.open-in-view=false

# ── Axon Server ────────────────────────────────────────────────────────────────
axon.axonserver.servers=localhost:8024
axon.axonserver.client-id=paymentService
axon.axonserver.context=default

# ── Async support (required by WalletAuditService @Async) ────────────────────
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20

# ── Cashfree Payment Gateway ───────────────────────────────────────────────────
# Use sandbox for development; switch to https://api.cashfree.com/pg for production
cashfree.base-url=https://sandbox.cashfree.com/pg
# Store secrets in Vault / env variables — never hard-code in production
cashfree.client-id=${CASHFREE_CLIENT_ID:TEST_CLIENT_ID}
cashfree.client-secret=${CASHFREE_CLIENT_SECRET:TEST_CLIENT_SECRET}
cashfree.api-version=2023-08-01
# Return URL after hosted checkout — {order_id} is replaced by Cashfree automatically
cashfree.return-url=${APP_BASE_URL:http://localhost:8080}/api/v1/payment/gateway/return
# Webhook endpoint Cashfree will POST payment events to
cashfree.webhook-url=${APP_BASE_URL:http://localhost:8080}/api/v1/payment/webhook/cashfree
# HTTP read/connect timeout for Cashfree API calls (seconds)
cashfree.timeout-seconds=30
# Order expiry window (minutes) — Cashfree max is 1440 (24 h)
cashfree.order-expiry-minutes=30

# ── Cashfree Payouts API ───────────────────────────────────────────────────────
cashfree.payout.base-url=https://sandbox.cashfree.com/payout/v1
# Reuse same credentials as PG (same Cashfree account)
cashfree.payout.client-id=${CASHFREE_CLIENT_ID:TEST_CLIENT_ID}
cashfree.payout.client-secret=${CASHFREE_CLIENT_SECRET:TEST_CLIENT_SECRET}
cashfree.payout.webhook-url=${APP_BASE_URL:http://localhost:8080}/api/v1/wallet-transfers/webhook/payout
cashfree.payout.timeout-seconds=30

# ── Kafka ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Consumer (for @KafkaListener sinks)
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bhagwat.scm.paymentService.streaming.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.bhagwat.scm.paymentService.streaming.event.PaymentSuccessEvent

# Kafka Streams (routing topology)
spring.kafka.streams.application-id=payment-event-router
spring.kafka.streams.bootstrap-servers=localhost:9092
spring.kafka.streams.default-key-serde=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.default-value-serde=org.springframework.kafka.support.serializer.JsonSerde
# Exactly-once semantics — requires Kafka broker 2.5+
spring.kafka.streams.properties.processing.guarantee=exactly_once_v2
spring.kafka.streams.properties.commit.interval.ms=1000

# ── Payment event topics ───────────────────────────────────────────────────────
payment.topics.success=payment.success.events
payment.topics.customer-tx=payment.customer.transactions
payment.topics.org-tx=payment.org.transactions
payment.topics.dead-letter=payment.dead.letter

# Sink concurrency (listener threads per topic partition group)
payment.sink.customer.concurrency=3
payment.sink.org.concurrency=3

# ── Data Purge Batch Job ───────────────────────────────────────────────────────
# Master kill switch — set to false to disable without redeploying
purge.batch.enabled=true
# Cron: daily at 02:00 AM server time (lowest traffic window)
purge.batch.cron=0 0 2 * * *
# Number of WalletTransfer IDs processed per DB transaction chunk
purge.batch.chunk-size=500
# Worker threads in the purge executor pool
purge.batch.thread-pool-size=4
# Max chunks in-flight concurrently before the job waits for results
purge.batch.max-parallel-chunks=8
# Data older than this many years is purged (server enforces 7-year hard cap)
purge.batch.retention-years=7
# Dry-run: log counts only, do NOT delete — safe to enable in production
purge.batch.dry-run=false

logging.config=classpath:logback-observability.xml
